name: SonosRemote
options:
  bundleIdPrefix: com.jenswedin
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  SonosKit:
    path: Packages/SonosKit
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    exactVersion: 1.3.1
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.0.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: FDBYWW84AR
    PROVISIONING_PROFILE_SPECIFIER: ""
    # Single source of truth for the version; scripts/release.sh overrides both on the command line.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # Debug: the owner's development identity, stable across rebuilds so the Local Network grant survives.
    # Hardened runtime stays off so the test host can be injected.
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development: hello@jenswedin.com (4B85FPKBH8)"
      ENABLE_HARDENED_RUNTIME: NO
    # Release: Developer ID for distribution outside the App Store; notarization requires the hardened runtime.
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      ENABLE_HARDENED_RUNTIME: YES
targets:
  SonosRemote:
    type: application
    platform: macOS
    sources:
      - path: SonosRemote
    entitlements:
      path: SonosRemote/SonosRemote.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: SonosRemote/Info.plist
      properties:
        CFBundleDisplayName: Remote for Sonos
        CFBundleName: Remote for Sonos
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 Jens Wedin. Not affiliated with Sonos, Inc."
        LSApplicationCategoryType: public.app-category.music
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSLocalNetworkUsageDescription: Remote for Sonos finds and controls your Sonos speakers on the local network.
        NSBonjourServices:
          - _sonos._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: SonosKit
      - package: MenuBarExtraAccess
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jenswedin.SonosRemote
        GENERATE_INFOPLIST_FILE: NO
  SonosRemoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SonosRemoteTests
    dependencies:
      - target: SonosRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SonosRemote:
    build:
      targets:
        SonosRemote: all
        SonosRemoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SonosRemoteTests
