name: SonosRemote
options:
  bundleIdPrefix: com.jenswedin
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  SonosKit:
    path: Packages/SonosKit
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    exactVersion: 1.3.1
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.0.1
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: FDBYWW84AR
    PROVISIONING_PROFILE_SPECIFIER: ""
    # Single source of truth for the version; scripts/release.sh overrides both on the command line.
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # Debug: the owner's development identity, stable across rebuilds so the Local Network grant survives.
    # Hardened runtime stays off so the test host can be injected.
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development: hello@jenswedin.com (4B85FPKBH8)"
      ENABLE_HARDENED_RUNTIME: NO
    # Release: Developer ID for distribution outside the App Store; notarization requires the hardened runtime.
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      ENABLE_HARDENED_RUNTIME: YES
targets:
  SonosRemote:
    type: application
    platform: macOS
    sources:
      - path: SonosRemote
    entitlements:
      path: SonosRemote/SonosRemote.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    info:
      path: SonosRemote/Info.plist
      properties:
        CFBundleDisplayName: Remote for Sonos
        CFBundleName: Remote for Sonos
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 Jens Wedin. Not affiliated with Sonos, Inc."
        LSApplicationCategoryType: public.app-category.music
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSLocalNetworkUsageDescription: Remote for Sonos finds and controls your Sonos speakers on the local network.
        NSBonjourServices:
          - _sonos._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SUFeedURL: https://github.com/jens-wedin/sonos-remote/releases/latest/download/appcast.xml
        SUPublicEDKey: pxnmYayx/gtqoXrOa6kIaUD3OOmVSgY1G7yZom65BD0=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    dependencies:
      - package: SonosKit
      - package: MenuBarExtraAccess
      - package: KeyboardShortcuts
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jenswedin.SonosRemote
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Strip Sparkle Downloader and sign Sparkle's helpers
        basedOnDependencyAnalysis: false
        script: |
          # The app already has network access, so Sparkle's downloader XPC service is unused.
          # Archive builds: Xcode's "Code Sign on Copy" only re-signs the framework itself when it
          # copies Sparkle.framework into the app; the nested helpers stay ad-hoc signed as Sparkle
          # ships them. Only Archive+Export would re-sign them, and release.sh copies the app
          # straight from the archive, so each helper must be signed here with the Developer ID
          # identity and a secure timestamp or Apple's notarization service rejects the archive.
          [ "$ACTION" = "install" ] || exit 0
          FW="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Frameworks/Sparkle.framework"
          rm -rf "$FW/Versions/B/XPCServices/Downloader.xpc"
          codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp "$FW/Versions/B/XPCServices/Installer.xpc"
          codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp "$FW/Versions/B/Autoupdate"
          codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp "$FW/Versions/B/Updater.app"
          codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp --preserve-metadata=identifier,entitlements,requirements,flags,runtime "$FW"
  SonosRemoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SonosRemoteTests
    dependencies:
      - target: SonosRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SonosRemote:
    build:
      targets:
        SonosRemote: all
        SonosRemoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SonosRemoteTests
